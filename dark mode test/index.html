<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="greenmode.css" id="green-mode-stylesheet">
</head>

<body>
    <h1>Hello World</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas, voluptate.</p>

    <button id="toggle-green-mode">Toggle <span>green</span> Mode</button>

    <script>
        const toggleButton = document.getElementById('toggle-green-mode');
        toggleButton.addEventListener('click', () => {
            document.getElementById('green-mode-stylesheet').disabled = !document.getElementById('green-mode-stylesheet').disabled;
        });
    </script>



</body>

</html>
